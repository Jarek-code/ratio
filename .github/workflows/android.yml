name: APK de Android

# Se puede lanzar a mano (Actions → APK de Android → Run workflow) o al empujar una etiqueta
# `v*`, que además publica el APK como release descargable.

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar el APK como release (necesita la etiqueta de la versión)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# El token del repositorio necesita permiso de escritura para crear el release
permissions:
  contents: write

env:
  # Versión del NDK y del CLI de Dioxus; deben coincidir con el proyecto
  NDK_VERSION: "30.0.16248370"
  DIOXUS_CLI: "0.7.10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  apk:
    name: Compilar y firmar el APK
    runs-on: ubuntu-latest

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      # Java 17 es lo que pide el Gradle que genera `dx`
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Rust con los objetivos de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # El NDK viene en el SDK de Android; se instala solo el que usa el proyecto
      - name: Preparar el SDK y el NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }} build-tools;34.0.0 platform-tools"

      - name: Guardar la caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.DIOXUS_CLI }}

      # `dx` compila el cliente y arma el proyecto de Gradle
      - name: Instalar el CLI de Dioxus
        run: |
          if ! command -v dx >/dev/null; then
            cargo install dioxus-cli --version "$DIOXUS_CLI" --locked
          fi
          dx --version

      # Todo el armado del APK lo hace `xtask`: las dos arquitecturas, el ícono, el
      # versionCode, Gradle y la firma. El proyecto parchea manganis para 32 bits
      # (DioxusLabs/dioxus#5641).
      - name: Compilar y firmar el APK
        env:
          CLAVE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CLAVE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

          if [ -n "$CLAVE_B64" ]; then
            echo "$CLAVE_B64" | base64 -d > /tmp/ratio-release.jks
            export RATIO_KEYSTORE=/tmp/ratio-release.jks
            export RATIO_KEYSTORE_PASSWORD="$CLAVE_CLAVE"
            export RATIO_KEY_ALIAS="$CLAVE_ALIAS"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_B64: la clave de firma será nueva en cada corrida"
          fi

          cargo run -p xtask -- apk

          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/movil/Cargo.toml | head -1)"
          mv target/ratio-android.apk "Ratio-$VERSION-android.apk"
          echo "APK=Ratio-$VERSION-android.apk" >> "$GITHUB_ENV"

      # Queda descargable en la pestaña Actions de cada ejecución
      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ratio-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      # Con una etiqueta `v*` (o pidiéndolo a mano) se publica como release
      - name: Publicar el release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          name: Ratio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          body: |
            APK de Ratio para Android.

            - Arquitecturas: arm64-v8a y armeabi-v7a
            - Android 7.0 o posterior
            - Instalación: abrir el archivo en el teléfono y permitir el origen desconocido

            El servidor debe estar desplegado; la app apunta a él.
          draft: false
          prerelease: false
