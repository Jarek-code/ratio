[package]
name = "ratio"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
description = "Aplicación móvil de Ratio"

[[bin]]
name = "ratio"
path = "src/main.rs"

[dependencies]
api = { workspace = true }
proporciones = { workspace = true }
dioxus = { workspace = true, features = ["router"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Temporizador de la renovación del token y, más adelante, de la cola sin conexión
tokio = { workspace = true, features = ["sync"] }
# Subida directa de fotos a Supabase Storage; ya venía dentro de la app por dioxus-fullstack
reqwest = { workspace = true }
# Compresión de fotos que pasan del límite del contenedor (solo decodificar y recodificar en JPEG)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Selector de fotos y push nativos de iOS; estas versiones ya venían en Cargo.lock por Dioxus
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSData", "NSEnumerator", "NSError", "NSString"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2", # present/dismiss del selector llevan bloque de cierre
    "objc2-core-foundation",
    "UIApplication",
    "UIResponder",
    "UIWindow",
    "UIView",
    "UIViewController",
    "UINavigationController",
    "UIImagePickerController",
    "UIImage",
    "UIGeometry", # margen seguro de la ventana (zona_segura_ios)
    "UIScrollView", # margen del scroll del WebView (zona_segura_ios)
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationResponse",
    "UNUserNotificationCenter",
] }

[features]
mobile = ["dioxus/mobile"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "api/server"]
