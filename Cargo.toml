[workspace]
resolver = "3"
members = ["apps/movil", "crates/api", "crates/proporciones", "crates/servidor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
proporciones = { path = "crates/proporciones" }
api = { path = "crates/api" }

dioxus = "0.7"
serde = { version = "1", features = ["derive"] }
