[workspace]
resolver = "3"
members = ["apps/movil", "crates/api", "crates/proporciones", "crates/servidor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
proporciones = { path = "crates/proporciones" }
api = { path = "crates/api" }

dioxus = "0.7"
serde = { version = "1", features = ["derive"] }

# Base de datos y servidor
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
anyhow = "1"
